[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "C4", "PIE", "RET"]
ignore = [
    "S101",  # assert statements are fine in tests
    "S104",  # API servers intentionally bind to all interfaces in containers
    "S105",  # hardcoded passwords: false positives on env var names
    "S106",
    "S108",  # controlled development temp paths are used for local TLS material
    "S310",  # OPA/JWKS URLs are operator-configured service endpoints
    "UP042", # keep str + Enum for Pydantic/FastAPI schema compatibility
    "B008",  # FastAPI Depends()/Header() in function defaults
]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["E402"]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/telemetry/setup.py",
    "*/tools/*",
    "*/api/envoy_ext_auth_pb2*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
fail_under = 60

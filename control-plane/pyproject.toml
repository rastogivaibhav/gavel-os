[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "UP", "S", "B", "C4", "PIE", "RET"]
ignore = [
    "S101",  # assert statements are fine in tests
    "S105",  # hardcoded passwords — false positives on env var names
    "S106",
    "B008",  # FastAPI Depends() in function defaults
]
exclude = ["__pycache__", ".venv", "build", "dist"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/telemetry/setup.py",
    "*/tools/*",
    "*/api/envoy_ext_auth_pb2*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
fail_under = 80

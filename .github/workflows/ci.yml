name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master", "feat/linux-ipv6-connect6-20261124", "feat/guarded-identity-hardening-20261124", "feat/guarded-landlock-filesystem-20261124", "feat/p0-resource-isolation", "feat/p0-network-mediation"]

jobs:
  # ── Go enforcer tests ────────────────────────────────────────────────────────
  enforcer-test:
    name: Enforcer (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: enforcer/go.mod
          cache: true

      - name: go vet
        working-directory: enforcer
        run: go vet ./...

      - name: go test
        working-directory: enforcer
        # Linux build tag: linux-tagged files run, windows-tagged files excluded.
        # The generated-at-runtime eBPF loader satisfies attachEnforcer on CI.
        run: go test -v -count=1 -timeout=60s ./...

      - name: Verify invalid policy cannot silently start an unprotected runtime
        working-directory: enforcer
        env:
          GAVEL_MACHINE_KEY: ""
          GAVEL_MONITORED_PIDS: "invalid-pid"
        run: |
          go build -o /tmp/gavel-enforcer .
          set +e
          timeout 10s /tmp/gavel-enforcer > /tmp/gavel-security-startup.log 2>&1
          exit_status=$?
          set -e
          cat /tmp/gavel-security-startup.log
          if [ "$exit_status" -eq 0 ] || [ "$exit_status" -eq 124 ]; then
            echo "SECURITY FAILURE: invalid policy started or hung in an unprotected mode"
            exit 1
          fi
          grep -q 'SECURITY BLOCKER' /tmp/gavel-security-startup.log


  # ── Python control plane tests ───────────────────────────────────────────────
  control-plane-test:
    name: Control Plane (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: control-plane/requirements-dev.txt

      - name: Install dependencies
        working-directory: control-plane
        run: pip install -r requirements-dev.txt

      - name: ruff lint
        working-directory: control-plane
        run: ruff check .

      - name: ruff format check
        working-directory: control-plane
        run: ruff format --check .

      - name: pytest with coverage
        env:
          ENV: development
          PYTHONPATH: ${{ github.workspace }}/control-plane
          ALLOW_INSECURE_DEV_AUTH: "false"
          GAVEL_MACHINE_KEY: "ci-machine-key-32-bytes-xxxxxxxxx"
          API_SECRET_KEY: "ci-api-key"
          ADMIN_SECRET_KEY: "ci-admin-secret"
          GRPC_INSECURE: "true"
          OPA_URL: "http://localhost:18181"
          JWKS_CACHE_TTL_SECONDS: "300"
        run: |
          pytest ../tests/ \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:../coverage.xml \
            --cov-fail-under=60
        working-directory: control-plane

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Docker build smoke test ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build control-plane image
        run: |
          docker build \
            --tag gavel-control-plane:ci \
            --file control-plane/Dockerfile \
            .

      - name: Verify packaged runtime entry point
        run: |
          docker image inspect gavel-control-plane:ci \
            --format '{{json .Config.Cmd}}' | grep 'api.main:app'

  # ── Secret scanning ──────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── VS Code extension tests ───────────────────────────────────────────────────
  vscode-extension-test:
    name: VS Code Extension (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: vscode-extension
        # Use npm install (not ci) since package-lock.json is gitignored
        run: npm install

      - name: TypeScript type check
        working-directory: vscode-extension
        run: npx tsc --noEmit

      - name: Run Jest tests
        working-directory: vscode-extension
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Build extension bundle
        working-directory: vscode-extension
        run: npm run build

  # Security proof job: only branch-originated PRs in THIS repository.
  # Never run arbitrary fork-contributed code with elevated kernel privileges.
  kernel-denial-proof:
    name: Kernel IPv4 Denial (ephemeral VM)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feat/linux-ipv6-connect6-20261124' || github.head_ref == 'feat/linux-udp-sendmsg-20261124' || github.head_ref == 'feat/guarded-identity-hardening-20261124' || github.head_ref == 'feat/guarded-landlock-filesystem-20261124' || github.head_ref == 'feat/p0-resource-isolation' || github.head_ref == 'feat/p0-unix-ipc-isolation' || github.head_ref == 'feat/p0-network-mediation' || github.head_ref == 'feat/p0-helper-identity') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: enforcer/go.mod
          cache: true
      - name: Mount bpffs for persistent kernel link tests
        run: |
          if ! mountpoint -q /sys/fs/bpf; then
            sudo mount -t bpf bpf /sys/fs/bpf
          fi
          findmnt -n -o FSTYPE --target /sys/fs/bpf | grep -qx bpf
      - name: Record isolated kernel environment
        run: |
          uname -a
          sudo sh -c 'grep -E "^(CapEff|CapBnd):" /proc/self/status'
          stat -fc %T /sys/fs/cgroup
      - name: Compile kernel proof test
        working-directory: enforcer
        run: |
          go test -c -o /tmp/gavel-kernel.test .
          chmod 755 /tmp/gavel-kernel.test
      - name: Assert real isolated cgroup/eBPF denial
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 45s /tmp/gavel-kernel.test \
            -test.run TestKernelConnect4Denial -test.v -test.timeout=40s
      - name: Assert agent and descendant inherit kernel cgroup denial and no supplementary groups
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 60s /tmp/gavel-kernel.test \
            -test.run TestKernelGuardedAgentAndDescendants -test.v -test.timeout=55s
      - name: Assert standalone monitored PID IPv6 TCP and native UDP kernel denial
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 65s /tmp/gavel-kernel.test \
            -test.run TestKernelConnect6DenialForMonitoredPID -test.v -test.timeout=60s
      - name: Assert IPv6 TCP and native UDP denial inherited by agent child
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 75s /tmp/gavel-kernel.test \
            -test.run TestKernelGuardedIPv6AndDescendants -test.v -test.timeout=70s
      - name: Assert pinned kernel protection survives supervisor SIGKILL
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 85s /tmp/gavel-kernel.test \
            -test.run TestKernelSupervisorSIGKILLRetainsBPF -test.v -test.timeout=80s

      - name: Assert actual privilege escalation and sibling cgroup migration denial
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 60s /tmp/gavel-kernel.test \
            -test.run '^TestKernelGuarded(Containment|RejectsDelegatedCgroup)$' -test.v -test.timeout=55s

      - name: Assert real guarded Landlock filesystem enforcement
        if: ${{ github.head_ref == 'feat/guarded-landlock-filesystem-20261124' || github.head_ref == 'feat/p0-resource-isolation' || github.head_ref == 'feat/p0-unix-ipc-isolation' || github.head_ref == 'feat/p0-network-mediation' || github.head_ref == 'feat/p0-helper-identity' }}
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 60s /tmp/gavel-kernel.test \
            -test.run '^TestKernelGuardedFilesystem$' -test.v -test.timeout=55s

      - name: Assert guarded inherited resource isolation
        if: ${{ github.head_ref == 'feat/p0-resource-isolation' || github.head_ref == 'feat/p0-unix-ipc-isolation' || github.head_ref == 'feat/p0-network-mediation' || github.head_ref == 'feat/p0-helper-identity' }}
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 60s /tmp/gavel-kernel.test \
            -test.run '^TestKernelGuardedDescriptors$' -test.v -test.timeout=55s

      - name: Assert guarded external Unix IPC isolation
        if: ${{ github.head_ref == 'feat/p0-unix-ipc-isolation' || github.head_ref == 'feat/p0-network-mediation' || github.head_ref == 'feat/p0-helper-identity' }}
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 60s /tmp/gavel-kernel.test \
            -test.run '^TestKernelGuardedUnixIPC$' -test.v -test.timeout=55s

      - name: Assert mapped IPv6 and connected UDP destination enforcement
        if: ${{ github.head_ref == 'feat/p0-network-mediation' || github.head_ref == 'feat/p0-helper-identity' }}
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 75s /tmp/gavel-kernel.test \
            -test.run '^TestKernelGuardedNetworkMediation$' -test.v -test.timeout=70s

      - name: Assert exclusive guarded UID and helper boundary
        if: ${{ github.head_ref == 'feat/p0-helper-identity' }}
        run: |
          sudo env GAVEL_RUN_KERNEL_TESTS=1 timeout 60s /tmp/gavel-kernel.test \
            -test.run '^TestKernelGuardedHelperIdentity$' -test.v -test.timeout=55s

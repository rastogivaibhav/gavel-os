name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ── Go enforcer tests ────────────────────────────────────────────────────────
  enforcer-test:
    name: Enforcer (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: enforcer/go.mod
          cache: true

      - name: go vet
        working-directory: enforcer
        run: go vet ./...

      - name: go test
        working-directory: enforcer
        # Linux build tag: linux-tagged files run, windows-tagged files excluded.
        # The generated-at-runtime eBPF loader satisfies attachEnforcer on CI.
        run: go test -v -count=1 -timeout=60s ./...

  # ── Python control plane tests ───────────────────────────────────────────────
  control-plane-test:
    name: Control Plane (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: control-plane/requirements-dev.txt

      - name: Install dependencies
        working-directory: control-plane
        run: pip install -r requirements-dev.txt

      - name: ruff lint
        working-directory: control-plane
        run: ruff check .

      - name: ruff format check
        working-directory: control-plane
        run: ruff format --check .

      - name: pytest with coverage
        env:
          ENV: development
          ALLOW_INSECURE_DEV_AUTH: "false"
          GAVEL_MACHINE_KEY: "ci-machine-key-32-bytes-xxxxxxxxx"
          API_SECRET_KEY: "ci-api-key"
          ADMIN_SECRET_KEY: "ci-admin-secret"
          GRPC_INSECURE: "true"
          OPA_URL: "http://localhost:18181"
          JWKS_CACHE_TTL_SECONDS: "300"
        run: |
          pytest ../tests/ \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:../coverage.xml \
            --cov-fail-under=60
        working-directory: control-plane

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Docker build smoke test ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build control-plane image
        run: |
          docker build \
            --tag gavel-control-plane:ci \
            --file control-plane/Dockerfile \
            .

      - name: Verify packaged runtime entry point
        run: |
          docker image inspect gavel-control-plane:ci \
            --format '{{json .Config.Cmd}}' | grep 'api.main:app'

  # ── Secret scanning ──────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── VS Code extension tests ───────────────────────────────────────────────────
  vscode-extension-test:
    name: VS Code Extension (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: vscode-extension
        # Use npm install (not ci) since package-lock.json is gitignored
        run: npm install

      - name: TypeScript type check
        working-directory: vscode-extension
        run: npx tsc --noEmit

      - name: Run Jest tests
        working-directory: vscode-extension
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Build extension bundle
        working-directory: vscode-extension
        run: npm run build

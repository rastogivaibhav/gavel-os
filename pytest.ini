[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --strict-markers --tb=short

markers =
    unit: Unit tests that mock external dependencies
    integration: Integration tests that use real services (OPA, PostgreSQL)
    e2e: End-to-end tests with live API server
    playwright: Playwright-based API endpoint validation tests

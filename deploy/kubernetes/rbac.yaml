apiVersion: v1
kind: ServiceAccount
metadata:
  name: gavel-control-plane
  namespace: gavel-system
  labels:
    app.kubernetes.io/name: gavel-control-plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gavel-enforcer
  namespace: gavel-system
  labels:
    app.kubernetes.io/name: gavel-enforcer
---
# Control plane: read ConfigMaps and Secrets in its own namespace only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gavel-control-plane
  namespace: gavel-system
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gavel-control-plane
  namespace: gavel-system
subjects:
  - kind: ServiceAccount
    name: gavel-control-plane
    namespace: gavel-system
roleRef:
  kind: Role
  name: gavel-control-plane
  apiGroup: rbac.authorization.k8s.io
---
# Enforcer DaemonSet: needs to read its own pod info for host identification
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gavel-enforcer
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gavel-enforcer
subjects:
  - kind: ServiceAccount
    name: gavel-enforcer
    namespace: gavel-system
roleRef:
  kind: ClusterRole
  name: gavel-enforcer
  apiGroup: rbac.authorization.k8s.io

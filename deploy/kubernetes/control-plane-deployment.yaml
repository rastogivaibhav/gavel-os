apiVersion: apps/v1
kind: Deployment
metadata:
  name: gavel-control-plane
  namespace: gavel-system
  labels:
    app.kubernetes.io/name: gavel-control-plane
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gavel-control-plane
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gavel-control-plane
        app.kubernetes.io/name: gavel-control-plane
    spec:
      serviceAccountName: gavel-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: control-plane
          image: ghcr.io/gavel-os/gavel-control-plane:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gavel-config
            - secretRef:
                name: gavel-secrets
          env:
            - name: GRPC_TLS_CERT_PATH
              value: /run/secrets/grpc-tls/server.crt
            - name: GRPC_TLS_KEY_PATH
              value: /run/secrets/grpc-tls/server.key
            # Uncomment for mTLS:
            # - name: GRPC_CA_CERT_PATH
            #   value: /run/secrets/grpc-tls/ca.crt
          volumeMounts:
            - name: grpc-tls
              mountPath: /run/secrets/grpc-tls
              readOnly: true
            - name: jwt-keys
              mountPath: /app/auth/keys
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: grpc-tls
          secret:
            secretName: gavel-grpc-tls
            optional: false
        - name: jwt-keys
          secret:
            secretName: gavel-jwt-keys
            optional: true   # auto-generated if not provided
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: gavel-control-plane

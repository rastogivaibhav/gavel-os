apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gavel-enforcer
  namespace: gavel-system
  labels:
    app.kubernetes.io/name: gavel-enforcer
    app.kubernetes.io/version: "1.0.0"
spec:
  selector:
    matchLabels:
      app: gavel-enforcer
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: gavel-enforcer
        app.kubernetes.io/name: gavel-enforcer
    spec:
      serviceAccountName: gavel-enforcer
      hostPID: false
      hostNetwork: false
      # ── Tolerations: run on all nodes including control-plane nodes ──────────
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: enforcer
          image: ghcr.io/gavel-os/gavel-enforcer:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GAVEL_ENGINE_URL
              value: "http://gavel-control-plane.gavel-system.svc:8000"
            - name: GAVEL_MACHINE_KEY
              valueFrom:
                secretKeyRef:
                  name: gavel-secrets
                  key: GAVEL_MACHINE_KEY
            - name: GAVEL_HOST_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            # eBPF requires CAP_BPF (or CAP_SYS_ADMIN on older kernels)
            capabilities:
              add:
                - BPF
                - SYS_ADMIN
                - NET_ADMIN
              drop:
                - ALL
            privileged: false
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: false
            - name: bpf
              mountPath: /sys/fs/bpf
              readOnly: false
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
      # Only schedule on Linux nodes
      nodeSelector:
        kubernetes.io/os: linux

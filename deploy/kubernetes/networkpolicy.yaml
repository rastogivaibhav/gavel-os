# Restrict control-plane ingress to enforcer nodes and internal cluster traffic only.
# Adjust cidr blocks to match your cluster's pod CIDR.

# ── Control plane: only accept traffic from enforcer pods and OPA ─────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gavel-control-plane-ingress
  namespace: gavel-system
spec:
  podSelector:
    matchLabels:
      app: gavel-control-plane
  policyTypes:
    - Ingress
  ingress:
    # Allow enforcer DaemonSet pods (machine-key authenticated)
    - from:
        - podSelector:
            matchLabels:
              app: gavel-enforcer
      ports:
        - port: 8000
          protocol: TCP
        - port: 50051
          protocol: TCP
    # Allow OPA to call back (health checks)
    - from:
        - podSelector:
            matchLabels:
              app: opa
      ports:
        - port: 8000
          protocol: TCP
    # Allow Prometheus scrape from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
          protocol: TCP
---
# ── OPA: only accept traffic from control-plane ───────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gavel-opa-ingress
  namespace: gavel-system
spec:
  podSelector:
    matchLabels:
      app: opa
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gavel-control-plane
      ports:
        - port: 8181
          protocol: TCP
---
# ── Enforcer: allow egress to control plane only ──────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gavel-enforcer-egress
  namespace: gavel-system
spec:
  podSelector:
    matchLabels:
      app: gavel-enforcer
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: gavel-control-plane
      ports:
        - port: 8000
          protocol: TCP
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

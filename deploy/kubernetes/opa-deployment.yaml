apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: gavel-system
  labels:
    app.kubernetes.io/name: opa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: opa
          image: openpolicyagent/opa:0.70.0
          args:
            - run
            - --server
            - --addr=0.0.0.0:8181
            - --log-level=info
            - --bundle
            - /policies
          ports:
            - name: http
              containerPort: 8181
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: policies
          configMap:
            name: gavel-opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: gavel-system
  labels:
    app.kubernetes.io/name: opa
spec:
  selector:
    app: opa
  ports:
    - name: http
      port: 8181
      targetPort: http
  type: ClusterIP

# secret-template.yaml — Document the required secrets structure.
# DO NOT commit actual secret values. Create secrets via:
#
#   kubectl create secret generic gavel-secrets \
#     --namespace gavel-system \
#     --from-literal=GAVEL_MACHINE_KEY=$(openssl rand -hex 32) \
#     --from-literal=API_SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=ADMIN_SECRET_KEY=$(openssl rand -hex 32) \
#     --from-literal=METRICS_SECRET_KEY=$(openssl rand -hex 16) \
#     --from-literal=DATABASE_URL="postgres://gavel:<password>@postgres:5432/gavel" \
#     --from-literal=REDIS_URL="redis://:<password>@redis:6379/0"
#
# For TLS certificates:
#   kubectl create secret generic gavel-grpc-tls \
#     --namespace gavel-system \
#     --from-file=server.crt=/path/to/server.crt \
#     --from-file=server.key=/path/to/server.key \
#     --from-file=ca.crt=/path/to/ca.crt   # optional, for mTLS
#
# For JWT keys (if not auto-generated):
#   kubectl create secret generic gavel-jwt-keys \
#     --namespace gavel-system \
#     --from-file=private.pem=/path/to/private.pem \
#     --from-file=public.pem=/path/to/public.pem

apiVersion: v1
kind: Secret
metadata:
  name: gavel-secrets
  namespace: gavel-system
  annotations:
    # Managed externally — do not apply this template directly
    gavel.io/managed-by: "external-secret-manager"
type: Opaque
stringData:
  GAVEL_MACHINE_KEY: "<generate with: openssl rand -hex 32>"
  API_SECRET_KEY: "<generate with: openssl rand -hex 32>"
  ADMIN_SECRET_KEY: "<generate with: openssl rand -hex 32>"
  METRICS_SECRET_KEY: "<generate with: openssl rand -hex 16>"
  DATABASE_URL: "postgres://gavel:<password>@postgres.gavel-system.svc:5432/gavel"
  REDIS_URL: "redis://:<password>@redis.gavel-system.svc:6379/0"

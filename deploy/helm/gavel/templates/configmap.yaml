apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gavel.fullname" . }}-config
  namespace: {{ include "gavel.namespace" . }}
  labels:
    {{- include "gavel.labels" . | nindent 4 }}
data:
  OPA_URL: "http://{{ include "gavel.fullname" . }}-opa.{{ include "gavel.namespace" . }}.svc:8181"
  OPA_PACKAGE_PATH: "sentinel/api/authz"
  OPA_TIMEOUT_SECONDS: "2.0"
  GAVEL_RUNTIME_POLICY_VERSION: {{ .Chart.AppVersion | quote }}
  {{- range $k, $v := .Values.controlPlane.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
